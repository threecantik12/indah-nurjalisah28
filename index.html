<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan Online</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Undangan Pernikahan</h1>
        <form id="invitationForm">
            <label for="namaPengantin">Nama Pengantin:</label>
            <input type="text" id="namaPengantin" required>

            <label for="tanggal">Tanggal Pernikahan:</label>
            <input type="date" id="tanggal" required>

            <label for="waktu">Waktu Pernikahan:</label>
            <input type="time" id="waktu" required>

            <label for="lokasi">Lokasi Pernikahan:</label>
            <input type="text" id="lokasi" required>

            <button type="submit">Kirim Undangan</button>
        </form>

        <div id="undangan" class="hidden">
            <h2>Undangan Pernikahan</h2>
            <p id="detailUndangan"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
